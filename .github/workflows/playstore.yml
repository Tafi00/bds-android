name: Deploy Android to Google Play Closed Testing

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track (closed, internal, production)'
        required: true
        default: 'closed'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_STORE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release Bundle (AAB)
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.PLAY_STORE_KEYSTORE_PASSWORD || 'futaland789' }}
          ANDROID_KEY_ALIAS: ${{ secrets.PLAY_STORE_KEY_ALIAS || 'upload' }}
          ANDROID_KEY_PASS: ${{ secrets.PLAY_STORE_KEY_PASSWORD || 'futaland789' }}
        run: |
          ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FutaLand-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Check Google Play credentials
        id: play_credentials
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -n "$PLAY_STORE_JSON_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Google Play Closed Testing
        if: steps.play_credentials.outputs.available == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.futaland.realestate
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'closed' }}
          status: completed
